<section class="mx-auto max-w-5xl px-4 py-12" aria-labelledby="productos-heading">
  <h1 id="productos-heading" class="text-3xl font-bold text-gray-900">Productos</h1>
  <p class="mt-2 text-gray-600">Explora la documentación funcional y técnica de cada producto de Estevez.jor.</p>

  <div class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (product of products(); track product.slug) {
      <app-product-card [product]="product" />
    } @empty {
      <p class="text-gray-500">Aún no hay productos documentados.</p>
    }
  </div>
</section>
