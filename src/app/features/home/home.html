<section class="bg-gradient-to-b from-blue-50 to-white">
  <div class="mx-auto max-w-5xl px-4 py-16 text-center">
    <h1 class="text-4xl font-bold tracking-tight text-gray-900 sm:text-5xl">Estevez Academy</h1>
    <p class="mx-auto mt-4 max-w-2xl text-lg text-gray-600">
      Centro de conocimiento tecnológico de Estevez.jor. Documentación funcional y técnica, paso a paso, de cada
      producto y servicio.
    </p>
  </div>
</section>

<section class="mx-auto max-w-5xl px-4 py-12" aria-labelledby="productos-heading">
  <h2 id="productos-heading" class="text-2xl font-semibold text-gray-900">Productos</h2>
  <div class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (product of products(); track product.slug) {
      <app-product-card [product]="product" />
    } @empty {
      <p class="text-gray-500">Aún no hay productos documentados.</p>
    }
  </div>
</section>
