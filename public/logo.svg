<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-label="Estevez.Jor">
  <defs>
    <linearGradient id="ejSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="0.5" stop-color="#c3c9d2"/>
      <stop offset="1" stop-color="#8a929e"/>
    </linearGradient>
    <linearGradient id="ejSilver2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e9edf2"/>
      <stop offset="1" stop-color="#9aa2ae"/>
    </linearGradient>
    <linearGradient id="ejBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ea3e6"/>
      <stop offset="1" stop-color="#0a63b8"/>
    </linearGradient>
  </defs>

  <!-- silver facets -->
  <g stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round">
    <!-- top -->
    <polygon points="160,26 116.7,106 203.3,106" fill="url(#ejSilver)"/>
    <!-- row 2 -->
    <polygon points="116.7,106 73.3,186 160,186" fill="url(#ejSilver2)"/>
    <polygon points="203.3,106 160,186 246.7,186" fill="url(#ejSilver2)"/>
    <!-- center blue diamond (hourglass) -->
    <polygon points="116.7,106 203.3,106 160,186" fill="url(#ejBlue)"/>
    <polygon points="116.7,266 203.3,266 160,186" fill="url(#ejBlue)"/>
    <!-- row 3 -->
    <polygon points="73.3,186 30,266 116.7,266" fill="url(#ejSilver)"/>
    <polygon points="73.3,186 160,186 116.7,266" fill="url(#ejSilver2)"/>
    <polygon points="160,186 246.7,186 203.3,266" fill="url(#ejSilver2)"/>
    <polygon points="246.7,186 203.3,266 290,266" fill="url(#ejSilver)"/>
  </g>

  <!-- spiral at apex -->
  <g transform="translate(160,60)" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round">
    <path d="M0,-14 A14,14 0 1 1 -12,7 A9,9 0 1 1 3,6 A4.5,4.5 0 1 1 -2,1"/>
  </g>

  <!-- outer triangle border -->
  <polygon points="160,26 30,266 290,266" fill="none" stroke="#111" stroke-width="7" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="160" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="46" fill="#111">Estevez<tspan fill="#0a63b8">.Jor</tspan></text>
</svg>
